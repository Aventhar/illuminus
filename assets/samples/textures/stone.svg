<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Stone</title>
  <filter id="s" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="6"
                  seed="42" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.55" intercept="0.55"/>
      <feFuncG type="linear" slope="0.55" intercept="0.55"/>
      <feFuncB type="linear" slope="0.55" intercept="0.55"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" filter="url(#s)"/>
</svg>
