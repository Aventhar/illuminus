<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Paper Fibres</title>
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="3"
                  seed="19" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.16" intercept="0.86"/>
      <feFuncG type="linear" slope="0.16" intercept="0.86"/>
      <feFuncB type="linear" slope="0.16" intercept="0.86"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" filter="url(#f)"/>
</svg>
