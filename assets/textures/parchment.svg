<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Parchment</title>
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="5"
                  seed="7" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.35" intercept="0.72"/>
      <feFuncG type="linear" slope="0.35" intercept="0.72"/>
      <feFuncB type="linear" slope="0.35" intercept="0.72"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" fill="#ffffff"/>
  <rect width="512" height="512" filter="url(#p)"/>
</svg>
