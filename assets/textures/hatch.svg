<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Fine Hatching</title>
  <defs>
    <pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#h)"/>
</svg>
